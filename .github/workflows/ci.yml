# Runs on every push/PR: makes sure both apps install and the client builds.
# Keeps a broken commit from reaching the Render/Vercel auto-deploys.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    name: Client (Vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build

  server:
    name: Server (syntax check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # Parse every module to catch syntax/import errors without needing a DB.
      - run: for f in $(find src -name '*.js'); do node --check "$f"; done
